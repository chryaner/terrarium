name: e2e-linux

# Drives real VMs on a Linux host: the hosted Ubuntu runners expose VT-x/AMD-V,
# so VirtualBox can boot guests there. Slow and network-heavy, so it runs
# weekly, on request, and on pull requests that touch what it exercises.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    paths:
      - internal/core/**
      - internal/vbox/**
      - internal/sshx/**
      - internal/paths/**
      - .github/workflows/e2e-linux.yml

permissions:
  contents: read

concurrency:
  group: e2e-linux-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build terrarium
        run: |
          go build -o terrarium ./cmd/terrarium
          sudo install terrarium /usr/local/bin/terrarium
      - name: Install VirtualBox
        timeout-minutes: 10
        run: |
          grep -cE 'vmx|svm' /proc/cpuinfo
          uname -r
          curl -fsSL --retry 3 https://download.virtualbox.org/virtualbox/debian/oracle_vbox_2016.asc | sudo gpg --dearmor -o /usr/share/keyrings/vbox.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/vbox.gpg] https://download.virtualbox.org/virtualbox/debian noble contrib" | sudo tee /etc/apt/sources.list.d/vbox.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "linux-headers-$(uname -r)" build-essential dkms virtualbox-7.2
          lsmod | grep vboxdrv
          VBoxManage --version
      - name: doctor
        run: |
          terrarium doctor
          # KVM and VirtualBox cannot both hold VT-x.
          for m in kvm_intel kvm_amd kvm; do
            if lsmod | grep -q "^$m "; then sudo modprobe -r "$m"; fi
          done
          terrarium doctor
      - name: Build a golden
        timeout-minutes: 10
        run: terrarium get debian-12
      - name: Env lifecycle
        timeout-minutes: 10
        run: |
          terrarium fork debian-12 e2e
          terrarium ls
          terrarium info e2e
          test "$(terrarium exec e2e -- uname -s)" = Linux

          # fork wrote the env into ~/.ssh/config, so the host's own ssh
          # reaches it by name.
          test "$(ssh e2e uname -s)" = Linux

          echo hello > /tmp/in.txt
          terrarium cp /tmp/in.txt e2e:/tmp/in.txt
          terrarium cp e2e:/tmp/in.txt /tmp/out.txt
          cmp /tmp/in.txt /tmp/out.txt

          terrarium exec e2e -- touch /home/terrarium/marker
          terrarium snapshot e2e marked
          terrarium revert e2e
          terrarium exec e2e -- sh -c 'test ! -e /home/terrarium/marker'
          terrarium restore e2e marked
          terrarium exec e2e -- test -e /home/terrarium/marker

          terrarium down e2e
          terrarium start e2e
          terrarium exec e2e -- true
      - name: Keyboard
        timeout-minutes: 5
        run: |
          terrarium screenshot e2e /tmp/before.png
          file /tmp/before.png | grep -q 'PNG image'

          # With the login prompt out of the way, a reader on the console
          # receives exactly what terrarium types.
          terrarium exec e2e -- sudo systemctl stop getty@tty1
          terrarium exec e2e -- sudo sh -c 'timeout 30 head -n1 < /dev/tty1' > /tmp/typed.txt &
          reader=$!
          sleep 3
          terrarium type e2e "typed-by-terrarium" --enter
          wait "$reader"
          test "$(cat /tmp/typed.txt)" = typed-by-terrarium
          terrarium keys e2e enter

          terrarium screenshot e2e /tmp/after.png
          file /tmp/after.png | grep -q 'PNG image'
          if cmp -s /tmp/before.png /tmp/after.png; then
            echo "the screen did not change after typing"; exit 1
          fi
      - name: Mouse through the web service
        timeout-minutes: 5
        run: |
          terrarium exec e2e -- sudo modprobe mousedev

          # The guest's mouse device delivers bytes only when the pointer
          # really moves or clicks.
          terrarium exec e2e -- sudo sh -c 'timeout 30 head -c 3 /dev/input/mice | wc -c' > /tmp/mice.txt &
          reader=$!
          sleep 3
          terrarium move e2e 100 100
          terrarium click e2e 120 120
          wait "$reader"
          test "$(cat /tmp/mice.txt)" = 3

          terrarium click e2e 120 120 --right
          terrarium click e2e 100 100 --double
          terrarium scroll e2e 3

          # Every call above shared one web service on the loopback port.
          test "$(pgrep -c vboxwebsrv)" = 1
          pid=$(pgrep vboxwebsrv)
          ss -ltnp | grep '127.0.0.1:42199'

          # A password VirtualBox no longer accepts is replaced, not fatal.
          VBoxManage setextradata global VBoxAuthSimple/users/terrarium bogus
          terrarium click e2e 100 100
          test "$(pgrep vboxwebsrv)" = "$pid"

          # A dead web service is started again.
          pkill vboxwebsrv
          while pgrep vboxwebsrv; do sleep 1; done
          terrarium click e2e 100 100
          test "$(pgrep -c vboxwebsrv)" = 1
      - name: Concurrent forks and removals
        timeout-minutes: 10
        run: |
          terrarium fork debian-12 a & pa=$!
          terrarium fork debian-12 b & pb=$!
          wait "$pa"
          wait "$pb"
          terrarium ls

          port_a=$(terrarium info a --json | jq -e .ssh_port)
          port_b=$(terrarium info b --json | jq -e .ssh_port)
          test "$port_a" != "$port_b"

          # Each name reaches its own guest.
          terrarium exec a -- sh -c 'echo a > /tmp/who'
          terrarium exec b -- sh -c 'echo b > /tmp/who'
          test "$(terrarium exec a -- cat /tmp/who)" = a
          test "$(terrarium exec b -- cat /tmp/who)" = b

          terrarium rm a & pa=$!
          terrarium rm b & pb=$!
          wait "$pa"
          wait "$pb"
          test "$(terrarium ls | grep -c 'env:')" = 1
      - name: Listing
        run: |
          # list is ls; the filters keep only what terrarium manages.
          test "$(terrarium list --envs --json | jq -r '.[].role')" = env:e2e
          test "$(terrarium ls --goldens --json | jq -r '.[].role')" = golden:debian-12
          test "$(terrarium ls --goldens --envs --json | jq length)" = 2
          test "$(terrarium ls --envs --json | jq -r '.[0].arch')" = x64
          terrarium ls | head -1 | grep -q ARCH
      - name: An env with its own identity
        timeout-minutes: 10
        run: |
          vms="$(VBoxManage list systemproperties | sed -n 's/^Default machine folder: *//p')"

          # Refused before anything is cloned.
          if terrarium fork debian-12 bad --hostname 'a;b'; then exit 1; fi
          if terrarium ls --envs | grep -q env:bad; then exit 1; fi

          terrarium fork debian-12 own --hostname own-box --new-mac --cpus 1 --memory 1024
          test "$(terrarium exec own -- hostname)" = own-box
          test "$(terrarium exec own -- cat /etc/hostname)" = own-box
          terrarium exec own -- sudo -n true
          test "$(terrarium exec own -- nproc)" = 1
          test "$(terrarium info own --json | jq .memory_mb)" = 1024

          mac() { VBoxManage showvminfo "$1" --machinereadable | sed -n 's/^macaddress1="\(.*\)"/\1/p'; }
          test -n "$(mac trr-own)"
          test "$(mac trr-own)" != "$(mac trr-golden-debian-12)"
          # Without the flags an env is the golden's twin.
          test "$(mac trr-e2e)" = "$(mac trr-golden-debian-12)"
          test "$(terrarium exec e2e -- hostname)" != own-box

          # The name survives a revert and a cold boot.
          terrarium revert own
          test "$(terrarium exec own -- hostname)" = own-box
          terrarium down own
          terrarium start own
          test "$(terrarium exec own -- hostname)" = own-box

          # Each machine logs its console to a file in its own folder.
          test -s "$vms/trr-own/serial.log"
          test -s "$vms/trr-e2e/serial.log"
          grep -q 'Linux version' "$vms/trr-own/serial.log"
          VBoxManage showvminfo trr-own --machinereadable | grep -F "uartmode1=\"file,$vms/trr-own/serial.log\""

          # A name in use says how to free it.
          if terrarium fork debian-12 own 2> /tmp/dup.txt; then exit 1; fi
          grep -q 'terrarium rm own' /tmp/dup.txt
          terrarium rm own
      - name: Copy through a pipe
        run: |
          head -c 5000000 /dev/urandom > /tmp/blob
          terrarium cp - e2e:/tmp/blob < /tmp/blob
          test "$(terrarium exec e2e -- stat -c %s /tmp/blob)" = 5000000
          terrarium cp e2e:/tmp/blob - > /tmp/blob.back
          cmp /tmp/blob /tmp/blob.back

          # The way a directory travels: packed on one side, unpacked on the other.
          mkdir -p /tmp/tree/sub && echo one > /tmp/tree/sub/f
          tar -C /tmp -c tree | terrarium cp - e2e:/tmp/tree.tar
          test "$(terrarium exec e2e -- sh -c 'tar -C /tmp -xf /tmp/tree.tar && cat /tmp/tree/sub/f')" = one

          if terrarium cp -r - e2e:/tmp/x < /tmp/blob; then exit 1; fi
          if terrarium cp - e2e:/tmp < /tmp/blob; then exit 1; fi
          if terrarium cp - e2e:/no/such/dir/blob < /tmp/blob; then exit 1; fi
          terrarium cp -p - e2e:/tmp/made/for/it/blob < /tmp/blob
          test "$(terrarium exec e2e -- stat -c %s /tmp/made/for/it/blob)" = 5000000
      - name: doctor --goldens
        timeout-minutes: 10
        run: |
          terrarium doctor --goldens debian-12 | tee /tmp/doctor.txt
          grep -q '^ok    golden debian-12: forks and runs a command' /tmp/doctor.txt
          # The probe env is gone again.
          if terrarium ls --envs | grep -q doctor-; then exit 1; fi

          if terrarium doctor --goldens no-such-golden > /tmp/doctor.txt; then exit 1; fi
          grep -q '^FAIL  golden no-such-golden' /tmp/doctor.txt
          # A name without the flag is a mistake, not a silent host-only check.
          if terrarium doctor debian-12; then exit 1; fi
      - name: A fork that cannot boot to sshd
        timeout-minutes: 20
        run: |
          d="${XDG_DATA_HOME:-$HOME/.local/share}/terrarium"

          # A golden whose guest boots and never offers ssh.
          terrarium fork debian-12 mute
          terrarium exec mute -- sudo systemctl mask ssh.service ssh.socket
          terrarium promote mute nossh
          terrarium rm mute

          if terrarium fork nossh dead > /tmp/dead.txt 2>&1; then cat /tmp/dead.txt; exit 1; fi
          cat /tmp/dead.txt
          # It booted to a login prompt, so it is waited for, not reset.
          if grep -q 'resetting the machine' /tmp/dead.txt; then exit 1; fi
          grep -q 'no SSH banner' /tmp/dead.txt
          grep -q 'rolled back, nothing left behind' /tmp/dead.txt
          # The error quotes the guest, and the evidence outlives the machine.
          grep -q 'the guest console ended with:' /tmp/dead.txt
          grep -q 'login:' /tmp/dead.txt
          test -s "$d/failed/dead.serial.log"
          file "$d/failed/dead.png" | grep -q 'PNG image'

          # Nothing is left to block the next attempt under the same name.
          if terrarium ls --envs | grep -q env:dead; then exit 1; fi
          if VBoxManage list vms | grep -q trr-dead; then exit 1; fi
          terrarium fork debian-12 dead
          terrarium rm dead
      - name: A fork that hangs at boot
        timeout-minutes: 20
        run: |
          d="${XDG_DATA_HOME:-$HOME/.local/share}/terrarium"

          # A golden whose guest stops in the initramfs on every boot, the
          # way a guest sometimes does on its own.
          terrarium fork debian-12 stuck
          terrarium exec stuck --stdin <<'EOF'
          echo 'GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX break=top"' | sudo tee /etc/default/grub.d/99-break.cfg
          sudo update-grub
          EOF
          terrarium promote stuck hangs
          terrarium rm stuck

          if terrarium fork hangs hung > /tmp/hung.txt 2>&1; then cat /tmp/hung.txt; exit 1; fi
          cat /tmp/hung.txt
          # The silent console is noticed and the machine reset, as often as allowed,
          # and then it gives up without sitting out the whole timeout again.
          grep -q 'resetting the machine (1 of 6)' /tmp/hung.txt
          grep -q 'resetting the machine (6 of 6)' /tmp/hung.txt
          grep -q 'hung while booting 7 times in a row' /tmp/hung.txt
          grep -q 'rolled back, nothing left behind' /tmp/hung.txt
          grep -q 'the guest console ended with:' /tmp/hung.txt
          test -s "$d/failed/hung.serial.log"
          if terrarium ls --envs | grep -q env:hung; then exit 1; fi
          terrarium rm --golden hangs
          terrarium rm --golden nossh
      - name: Data directory is owner-only
        run: |
          d="${XDG_DATA_HOME:-$HOME/.local/share}/terrarium"
          test "$(stat -c %a "$d")" = 700
          test "$(stat -c %a "$d/state.json")" = 600
          test "$(stat -c %a "$d/vboxweb.secret")" = 600

          # A directory someone loosened is tightened by doctor and by any
          # command that writes state.
          chmod 755 "$d"
          terrarium doctor
          test "$(stat -c %a "$d")" = 700
      - name: Remove
        run: |
          terrarium rm e2e
          terrarium rm --golden debian-12
          test -z "$(VBoxManage list vms)"
          if terrarium ls | grep -E 'env:|golden:'; then exit 1; fi
      - name: Collect diagnostics
        if: failure()
        run: |
          set +e
          mkdir -p /tmp/diag
          d="${XDG_DATA_HOME:-$HOME/.local/share}/terrarium"
          terrarium ls > /tmp/diag/ls.txt 2>&1
          VBoxManage list vms > /tmp/diag/vms.txt 2>&1
          cp "$d/vboxwebsrv.log" /tmp/diag/ 2>/dev/null
          sudo cp /var/log/vbox-setup.log /tmp/diag/ 2>/dev/null
          for vm in $(VBoxManage list runningvms | sed 's/^"\(.*\)" .*/\1/'); do
            VBoxManage controlvm "$vm" screenshotpng "/tmp/diag/$vm.png"
          done
          for f in "$HOME"/VirtualBox\ VMs/*/Logs/VBox.log; do
            cp "$f" "/tmp/diag/$(basename "$(dirname "$(dirname "$f")")").VBox.log"
          done
          sudo chmod -R a+r /tmp/diag
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-linux
          path: |
            /tmp/*.png
            /tmp/diag
          if-no-files-found: ignore
