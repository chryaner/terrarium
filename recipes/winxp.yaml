# Windows XP from your own installation ISO, saved as
# %LOCALAPPDATA%\terrarium\isos\winxp.iso. XP predates PowerShell and OpenSSH,
# so the golden is credless: forks are driven with screenshot, click, type and
# keys instead of exec, and the installer signals completion by shutting the
# machine down.
name: winxp
path: winxp.iso
format: iso
ostype: WindowsXP
# XP setup cannot proceed without a product key and terrarium cannot ship one.
# Copy this file to %LOCALAPPDATA%\terrarium\recipes\winxp.yaml and add yours:
# key: XXXXX-XXXXX-XXXXX-XXXXX-XXXXX
# The installer insists on creating an account; the credless golden never
# records these credentials, so the value does not matter.
password: "1"
ssh: false
# VirtualBox 7 guest additions no longer support XP.
additions: false
disk_gb: 20
install_timeout_min: 45
efi: false
tpm: false
